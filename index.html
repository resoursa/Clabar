<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Клабар</title>
  <meta name="description" content="Записник для гри в клабар: рахунок, бейти, висяки та правила.">
  <meta name="theme-color" content="#F5F7F4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Клабар">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" type="button">
        <span class="brand-suit" aria-hidden="true">♣</span>Клабар
      </button>
      <nav class="topbar-actions">
        <button class="text-btn" id="rulesBtn" type="button" data-i18n="rules"></button>
        <button class="text-btn" id="menuBtn" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="menu"></button>
      </nav>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <div class="menu" id="menu" hidden>
    <button type="button" data-action="undo" data-i18n="undo"></button>
    <button type="button" data-action="lang" data-i18n="switchLang"></button>
    <button type="button" data-action="install" data-i18n="install" hidden></button>
  </div>

  <dialog class="sheet" id="sheet"></dialog>
  <dialog class="confirm" id="confirm"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
